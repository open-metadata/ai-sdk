# This file should be placed in ~/.dbt/profiles.yml
# Or use DBT_PROFILES_DIR environment variable

jaffle_shop:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5433
      user: jaffle_user
      password: jaffle_pass
      dbname: jaffle_shop
      schema: public
      threads: 4

    starburst:
      type: trino
      method: "{{ env_var('STARBURST_METHOD', 'ldap') }}"
      host: "{{ env_var('STARBURST_HOST') }}"
      port: "{{ env_var('STARBURST_PORT', '443') | int }}"
      user: "{{ env_var('STARBURST_USER') }}"
      password: "{{ env_var('STARBURST_PASSWORD', '') }}"
      http_scheme: "{{ env_var('STARBURST_HTTP_SCHEME', 'https') }}"
      database: "{{ env_var('STARBURST_CATALOG', 'iceberg') }}"
      schema: "{{ env_var('STARBURST_SCHEMA', 'jaffle_shop') }}"
      threads: 4
