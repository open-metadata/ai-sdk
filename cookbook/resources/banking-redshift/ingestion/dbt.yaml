source:
  type: dbt
  serviceName: banking-redshift
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        # Resolved against BANKING_DBT_TARGET, which scripts/ingest_metadata.sh
        # exports (defaults to <resource_root>/dbt/target). os.path.expandvars
        # does not support ${VAR:-default}, so the shell must set the variable.
        dbtManifestFilePath: ${BANKING_DBT_TARGET}/manifest.json
        dbtCatalogFilePath: ${BANKING_DBT_TARGET}/catalog.json
        dbtRunResultsFilePath: ${BANKING_DBT_TARGET}/run_results.json
      dbtUpdateDescriptions: true
      dbtUpdateOwners: true
      includeTags: true

sink:
  type: metadata-rest
  config: {}

# IngestionPipeline registration: FQN leads with the service name; runId is a per-run UUID.
ingestionPipelineFQN: banking-redshift.dbt
pipelineRunId: 0032984c-09d8-4b17-81c1-b1b1fe38ab0a

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: "${AI_SDK_HOST}/api"
    authProvider: openmetadata
    securityConfig:
      jwtToken: "${AI_SDK_TOKEN}"
