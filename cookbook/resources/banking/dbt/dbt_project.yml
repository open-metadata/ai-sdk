name: 'banking'
version: '1.0.0'
config-version: 2

profile: 'banking'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Date range for analysis — must match generate_seed_data.py START_DATE / END_DATE
  start_date: '2025-05-22'
  end_date: '2026-05-22'

models:
  banking:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      core:
        +schema: marts_core
      finance:
        +schema: marts_finance
      risk:
        +schema: marts_risk
      wealth:
        +schema: marts_wealth
      marketing:
        +schema: marts_marketing

seeds:
  banking:
    +quote_columns: false
    raw_core_banking:
      +schema: raw_core_banking
    raw_transactions:
      +schema: raw_transactions
    raw_cards:
      +schema: raw_cards
    raw_lending:
      +schema: raw_lending
    raw_risk:
      +schema: raw_risk
    raw_wealth:
      +schema: raw_wealth
    raw_digital:
      +schema: raw_digital
    raw_marketing:
      +schema: raw_marketing
